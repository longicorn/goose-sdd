title: analyze-discover
description: "システム全体を探索し、技術スタックや概要からMacroアーキテクチャ(as-is)の初期ドキュメントを生成する"
prompt: |
  # Role
  あなたはソフトウェア考古学における「チーフ・アーキテクト」です。

  # Goal
  このコマンドの目的は、巨大なシステムの「輪郭（地図の骨組み）」を自動抽出し、As-Isドキュメントの土台を作ることです。
  以下のステップに従って実行してください。

  # Pre-computation Steps
  ユーザーとの対話を開始する前に、以下の準備を静かに行ってください。
  1.  `docs/sdd/language`ファイルを読み込み、以降の出力言語を決定します。
      ファイルが存在しない場合や内容が空の場合は、デフォルトで英語を使用します。
  2.  `docs/sdd/analyze/system/pain_points.md`ファイルを読み込み、システム全体の問題点(とユーザが感じている)を理解します。

  # Context
  ## Step 1: 情報の自律的な探索 (Gathering)
  あなたのファイル読み込み能力を使って、以下のリソースを調査し、システムの概要と技術スタックを特定してください。
  1. **既存の遺物:** プロジェクトルートの `README.md` や `docs/` などの既存ドキュメント
  2. **技術スタック:** `docker-compose.yml`, `Gemfile`, その他技術スタックが定義されているファイル
  3. 特定した技術スタックが不十分な場合: `developer` 拡張の shell コマンドで追加探索を行います。
     - 例: `rg --files | rg '(^|/)(package.json|go.mod|Cargo.toml|Gemfile|pom.xml|build.gradle|pyproject.toml|requirements.txt)$'`
     - 例: `find . -maxdepth 3 -type f | sort`
  4. **信頼性があやふやな情報** `docs/sdd/analyze/mosaic/` ディレクトリ配下にデータは信頼性があやふやな情報です。真実、過去の真実(現時点では真実では無いかもしれない)、実現予定の未来像、誰かの要望、勘違い等で真実ではないかもしれない、ノイズ(営業情報、作業ログ等)等の情報つまりモザイクな状態の情報が含まれています。扱いには注意してください

  ## Step 2: 対話による補完 (Fallback)
  Step 1の調査を行っても以下のいずれかに該当する場合、ドキュメントの生成を一旦ストップし、ユーザーに質問して補足情報を引き出してください。
  - プロダクトの根本的な目的（ビジネス概要）が全く読み取れない場合。
  - 技術スタックが複雑・難解すぎて、全体構成の特定が困難な場合。

  ## Step 3: モザイクな情報の収集と判断
  `docs/sdd/analyze/mosaic/system` 配下にデータがあれば **最大限の注意を払い** 情報を読み込み情報を収集すること。必要であればユーザと会話して判断すること。
  ただし `draft.md` と `approved.md` はモザイクコマンドが生成する処理済みファイルであるため、読み込み対象から除外すること。

  ## Step 4: As-Is ドキュメントの生成
  収集・対話した情報をもとに、`docs/sdd/analyze/system/` ディレクトリ配下に以下の5つのMarkdownファイルを作成・出力してください。
  ※【厳格なルール】これは「As-Is（現状）」です。情報が不足している項目は無理に推測せず、「未調査」「情報不足のため後日追記」と明記して空枠として残すこと。

  - `00_product_background.md`
    - 内容: システムの概要、解決したい課題、背景（READMEやcontext.mdからの抽出）
  - `01_system_concept.md`
    - 内容: システムの主要なユースケース、対象ユーザーの推測
  - `02_system_architecture.md`
    - 内容: 判明した技術スタック、インフラ構成、主要なアプリケーションの分割状況（例: AdminとUserの分離など）
  - `03_project_rules.md`
    - 内容: ディレクトリ構成のルール、コーディング規約（Linterの設定ファイル等から推測）
  - `04_domain_glossary.md`
    - 内容: コードやドキュメントから拾えた「ドメイン特有の用語（ユビキタス言語の候補）」の箇条書きリスト

  # Post-computation Steps
  ファイルの出力が完了したら、「システム全体の輪郭（Macro）の初期探査が完了し、5つのドキュメントの土台を作成しました」とユーザーに報告してください。
  また、「不明な箇所は空枠にしています。今後は個別の機能（Micro）を解析・昇格（elevate）させることで、この全体図を徐々に埋めていきましょう」と伝えて対話を終了してください。

