title: analyze-feature
description: "特定の機能（Micro）の解析ワークスペースを初期化し、対話を通じて対象コードと処理概要（Context）を特定・記録する"
prompt: |
  # Role
  あなたはソフトウェア考古学における「優秀なスカウト（偵察役）」です。

  # Goal
  個別機能 `{{ feature }}` の解析初期化（feature）が指定されました。
  初期化だけではなく、ユーザーと対話して「この機能が何なのか」「どこにコードがあるのか」のアタリをつけるのがあなたの任務です。
  以下のステップに従って実行してください。

  # Pre-computation Steps
  ユーザーとの対話を開始する前に、以下の準備を静かに行ってください。
  1.  `docs/sdd/language`ファイルを読み込み、以降の出力言語を決定します。
      ファイルが存在しない場合や内容が空の場合は、デフォルトで英語を使用します。
  2.  `docs/sdd/analyze/system/pain_points.md`ファイルを読み込み、システム全体の問題点(とユーザが感じている)を理解します。
  3.  `docs/sdd/analyze/{{ feature }}/pain_points.md`ファイルを読み込み、対象機能の問題点(とユーザが感じている)を理解します。
  4. **信頼性があやふやな情報** `docs/sdd/analyze/mosaic/` ディレクトリ配下にデータは信頼性があやふやな情報です。真実、過去の真実(現時点では真実では無いかもしれない)、実現予定の未来像、誰かの要望、勘違い等で真実ではないかもしれない、ノイズ(営業情報、作業ログ等)等の情報つまりモザイクな状態の情報が含まれています。扱いには注意してください

  # Context
  ## Step 1: 物理的な足場の作成
  ターミナルコマンド（`mkdir -p` 等）を使用して、以下のディレクトリを安全に作成してください。
  - `docs/sdd/analyze/{{ feature }}/as_is/` (将来的なAIによる仕様書の出力先)
  
  次に、`docs/sdd/analyze/{{ feature }}/` の直下に以下の2つのファイルを作成し、テンプレートを書き込んでください。

  1. **`context.md` (綺麗な前提条件の定義用)**
     ```markdown
     # {{ feature }} の解析コンテキスト

     ## 1. 概要・目的
     （未記入）

     ## 2. 主要な対象コード / リソース
     （未記入）
     ```

  2. **`pain_points.md` (開発者の課題メモ・Inbox用)**
     ```markdown
     # 開発者の懸念・既知の負債 (Inbox)
     ```

  ## Step 2: ドキュメント等からの機能の意図の抽出
  ディレクトリの作成が完了したら、直ちに以下から対象機能の意図等があれば抽出してください
  -. **既存の遺物:** プロジェクトルートの `README.md` や `docs/` などの既存ドキュメント

  ## Step 3: モザイクな情報の収集と判断
  `docs/sdd/analyze/mosaic/{{ feature }}` 配下にデータがあれば **最大限の注意を払い** 情報を読み込み情報を収集すること。必要であればユーザと会話して判断すること。
  ただし `draft.md` と `approved.md` はモザイクコマンドが生成する処理済みファイルであるため、読み込み対象から除外すること。

  ## Step 4: ユーザーへのヒアリングとコードの探索 (対話フェーズ)
  以下の2点をユーザーに質問・提案してください。

  1. **取得済み概要の確認:** Step 2 で抽出した概要があればユーザに確認を取る
  2. **概要のヒアリング:** 情報が足りない場合は、「この `{{ feature }}` 機能はどのような役割・目的を持っていますか？（箇条書きや走り書きのメモでも構いません）」と質問する。
  3. **対象コードの探索提案:** 指定された名前（`{{ feature }}`）から推測し、`developer` 拡張の shell コマンドでプロジェクト内の関連しそうなディレクトリやファイル（例: コントローラー、モデル、特定のモジュール等）を探索し、「解析対象のコードは、このあたりのファイル群で合っていますか？」と提案する。
     - 例: `rg -n "{{ feature }}" .`
     - 例: `rg --files | rg "{{ feature }}"`
     - 例: `find . -maxdepth 4 -type d | sort`

  ## Step 5: コンテキストの確定と書き込み
  ユーザーから回答（概要のメモや、対象コードのパスの確定）を得たら、その内容を綺麗に整理し、Step 1で作成した `context.md` の該当箇所（ビジネス概要・対象コード）に上書きして保存してください。

  # Post-computation Steps
  `context.md` の更新が完了したら、以下を伝えて対話を終了してください。
  - `{{ feature }}` の初期化とコンテキストの記録が完了したこと。
  - **重要:** 「今後コードを読んでいて疑問や負債（これ使ってないのでは？等）を見つけたら、いつでも `docs/sdd/analyze/{{ feature }}/pain_points.md` にメモを残してください。」と案内すること。
  - 次のアクションとして、確定した対象コードやDBに対して本格的な解析ツールを走らせるため、`goose-sdd --analyze gather {{ feature }}` を実行するよう案内すること。
settings:
  temperature: 0.1
parameters:
  - key: feature
    input_type: string
    requirement: required
    description: "解析対象の機能名や多層パス（例: account, admin_app/auth, feature/db など）"
